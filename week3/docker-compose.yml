
services:
  postgres:
    image: postgres:17
    container_name: irctc-postgres
    environment:
      POSTGRES_DB: irctc
      POSTGRES_USER: irctc_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - irctc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irctc_user -d irctc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://irctc_user:local_dev_password@postgres:5432/irctc
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  irctc_postgres_data:
